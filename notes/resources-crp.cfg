// Volumetric Explosions: what other mods' resources are taken as when a part holding them blows up.
//
// Each line is one resource and the stock resource it counts as. The kinds are the ones the mod already
// knows (see Records.Sort and the README): LiquidFuel, Oxidizer, SolidFuel, MonoPropellant, XenonGas (a cold
// burst), Ore (dust), ElectricCharge (a blue-white flash, counted in units, not kilograms), and two of its own:
// Hydrogen (fuel that burns with a clear, nearly smokeless flame) and Vapour (a cloud, no fire). None means the
// resource is left out of the reckoning, as Ablator and IntakeAir are.
//
// A resource named here is never guessed at by its name; one not named here still is, as before.
//
// These are the resources of the Community Resource Pack 1.4.2 (CommonResources.cfg), every one of them.

